name: ShareDesk Pro - server build

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # rustdesk/rustdesk-server commit the allowlist patch was written and tested against.
  SERVER_REPO: rustdesk/rustdesk-server
  SERVER_REF: 680b60395ecf99a76f74a1d934e453bb6e5e0aa2
  TARGET: x86_64-unknown-linux-musl
  TAG_NAME: sharedesk-server

jobs:
  build:
    name: Build hbbs/hbbr with device allowlist (linux amd64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ShareDesk Pro
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout rustdesk-server
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ env.SERVER_REPO }}
          ref: ${{ env.SERVER_REF }}
          path: rds
          submodules: recursive

      - name: Apply allowlist patch
        run: python3 server/apply_allowlist.py rds

      - name: Use vendored OpenSSL for the static musl build
        run: |
          grep -q "target_env = \"musl\"" rds/Cargo.toml && { echo "musl section already exists"; exit 1; }
          cat >> rds/Cargo.toml <<'EOF'

          [target.'cfg(target_env = "musl")'.dependencies]
          openssl = { version = "0.10", features = ["vendored"] }

          # hbb_common is also a build-dependency, compiled for the host inside the cross image.
          [build-dependencies.openssl]
          version = "0.10"
          features = ["vendored"]
          EOF
          tail -8 rds/Cargo.toml

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"

      - name: Install cross
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cross

      - name: Unit tests
        working-directory: rds
        run: cargo test --release --lib allowlist

      - name: Build
        working-directory: rds
        run: cross build --release --target "$TARGET" --bin hbbs --bin hbbr

      - name: Package
        env:
          RELEASE_TAG: ${{ env.TAG_NAME }}-b${{ github.run_number }}
        run: |
          mkdir -p out
          cp "rds/target/$TARGET/release/hbbs" "rds/target/$TARGET/release/hbbr" out/
          cp server/deploy.sh out/
          # deploy.sh downloads exactly the binaries of this release.
          sed -i "s|releases/download/sharedesk-server\"|releases/download/$RELEASE_TAG\"|" out/deploy.sh
          grep -q "releases/download/$RELEASE_TAG\"" out/deploy.sh
          chmod +x out/*
          file out/hbbs out/hbbr
          cd out && sha256sum hbbs hbbr deploy.sh > SHA256SUMS && cat SHA256SUMS

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/hbbs
            out/hbbr
            out/deploy.sh

      # Each build gets its own tag; with release immutability enabled the
      # files of a published release can never be replaced.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.TAG_NAME }}-b${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" out/hbbs out/hbbr out/deploy.sh out/SHA256SUMS \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "ShareDesk Pro server (approved masters only), build ${{ github.run_number }}" \
            --notes "hbbs/hbbr from rustdesk-server ${{ env.SERVER_REF }} with the ShareDesk Pro approved-masters allowlist (AGPL-3.0). Patch: server/allowlist.rs, server/apply_allowlist.py. Install: server/README.md.

          Verify a download: gh attestation verify <file> -R ${{ github.repository }}"
