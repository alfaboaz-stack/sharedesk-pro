name: ShareDesk Pro - Windows build

# Builds the branded ShareDesk Pro client for Windows x64 only.
# Server address and public key come from the repository secrets
# RENDEZVOUS_SERVER and RS_PUB_KEY. Icons and logos are committed under
# res/, flutter/assets/ and flutter/windows/runner/resources/ (sources in branding/).

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: Build ${{ matrix.display_name }} (Windows x64)
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # Master: controls other devices (the server requires its ID to be approved).
          # Not installed (portable run) it works as a host only.
          - variant: master
            app_name: ShareDesk-Pro
            display_name: ShareDesk Pro
            tag: sharedesk-pro
          # Host: can only be controlled; needs no approval.
          - variant: host
            app_name: ShareDesk-Pro-Host
            display_name: ShareDesk Pro Host
            tag: sharedesk-pro-host
    env:
      TARGET: x86_64-pc-windows-msvc
      VCPKG_TRIPLET: x64-windows-static
      SHAREDESK_VARIANT: ${{ matrix.variant }}
      APP_NAME: ${{ matrix.app_name }}
      DISPLAY_NAME: ${{ matrix.display_name }}
      TAG_NAME: ${{ matrix.tag }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Apply ShareDesk Pro branding
        shell: bash
        env:
          SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER" ] || [ -z "$KEY" ]; then
            echo "RENDEZVOUS_SERVER and RS_PUB_KEY secrets are required"; exit 1
          fi
          cfg=./libs/hbb_common/src/config.rs
          sed -i -e "s|RwLock::new(\"RustDesk\".to_owned())|RwLock::new(\"$APP_NAME\".to_owned())|" "$cfg"
          sed -i -e "s|\"rs-ny.rustdesk.com\"|\"$SERVER\"|" "$cfg"
          sed -i -e "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|$KEY|" "$cfg"
          grep -q "\"$APP_NAME\"" "$cfg"
          grep -q "\"$SERVER\"" "$cfg"
          grep -q -F "$KEY" "$cfg"

          for f in ./Cargo.toml ./libs/portable/Cargo.toml; do
            sed -i -e "s|description = \"RustDesk Remote Desktop\"|description = \"$DISPLAY_NAME\"|" "$f"
            sed -i -e "s|ProductName = \"RustDesk\"|ProductName = \"$DISPLAY_NAME\"|" "$f"
            sed -i -e "s|FileDescription = \"RustDesk Remote Desktop\"|FileDescription = \"$DISPLAY_NAME\"|" "$f"
            sed -i -e "s|OriginalFilename = \"rustdesk.exe\"|OriginalFilename = \"$APP_NAME.exe\"|" "$f"
          done
          sed -i -e "s|const APP_PREFIX: \&str = \"rustdesk\";|const APP_PREFIX: \&str = \"$APP_NAME\";|" ./libs/portable/src/main.rs

          rc=./flutter/windows/runner/Runner.rc
          sed -i -e "s|\"RustDesk Remote Desktop\"|\"$DISPLAY_NAME\"|" "$rc"
          sed -i -e "s|VALUE \"InternalName\", \"rustdesk\"|VALUE \"InternalName\", \"$APP_NAME\"|" "$rc"
          sed -i -e "s|\"rustdesk.exe\"|\"$APP_NAME.exe\"|" "$rc"
          sed -i -e "s|\"RustDesk\"|\"$DISPLAY_NAME\"|" "$rc"

          sed -i -e 's|updateUrl.isNotEmpty|false|' ./flutter/lib/desktop/pages/desktop_home_page.dart

          python3 ./branding/apply_settings.py

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ env.VCPKG_TRIPLET }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build ShareDesk Pro
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            }
          } catch {
              Write-Host "Ignore the printer driver error."
          }

      - name: Copy branded icons into the app assets
        shell: bash
        run: |
          cp ./res/icon.ico ./rustdesk/data/flutter_assets/assets/icon.ico

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then
            cp $runner_res ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Rename executable
        shell: bash
        run: mv ./rustdesk/rustdesk.exe "./rustdesk/$APP_NAME.exe"

      - name: Upload unpacked files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.app_name }}-windows-x64-files
          path: rustdesk

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/$APP_NAME.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/$APP_NAME-$VERSION-x86_64.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --app-name "${{ env.APP_NAME }}" --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName "../../SignOutput/${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64.msi"
          popd

      - name: Checksums
        shell: bash
        run: |
          cd SignOutput
          sha256sum *.msi *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            SignOutput/*.msi
            SignOutput/*.exe

      # Each build gets its own tag; with release immutability enabled the
      # files of a published release can never be replaced.
      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.TAG_NAME }}-${{ env.VERSION }}-b${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" SignOutput/*.msi SignOutput/*.exe SignOutput/SHA256SUMS.txt \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "${{ matrix.display_name }} ${{ env.VERSION }} (build ${{ github.run_number }})" \
            --notes "ShareDesk Pro for Windows x64, built from this repository (based on RustDesk, AGPL-3.0). The server address and key are built in.

          Verify a download: compare its SHA-256 with SHA256SUMS.txt, or run
          gh attestation verify <file> -R ${{ github.repository }}"
